name: Daily Sync and Release

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Configure git committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add remote oc
        run: git remote add oc https://github.com/anomalyco/models.dev.git

      - name: Fetch oc
        run: git fetch oc

      - name: Merge oc/dev into dev
        run: |
          BEFORE=$(git rev-parse HEAD)
          git merge oc/dev --no-edit
          if [ $? -ne 0 ]; then
            echo "::error::Merge conflict detected. Aborting merge and stopping workflow."
            git merge --abort
            exit 1
          fi
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "Merge produced new commits, pushing to origin/dev"
            git push origin dev
          else
            echo "Already up to date, no push needed"
          fi

      - name: Install dependencies
        run: bun install

      - name: Validate
        run: bun validate

      - name: Generate api.json
        run: bun ./packages/core/script/generate-lz-release.ts

      - name: Determine version
        id: version
        run: |
          DATE_PART=$(TZ=Asia/Shanghai date +%Y%m%d)
          HASH_PART=$(git rev-parse --short=7 HEAD)
          VERSION="${DATE_PART}-${HASH_PART}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_name=Models Data $VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.release_name }}
          files: api.json
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## Models Data Release
            
            This release contains the latest AI model specifications database.
            
            - **File**: `api.json`
            - **Format**: JSON
            - **Contents**: Provider and model specifications with pricing, capabilities, and limits
            
            ### Usage
            
            ```bash
            curl -sL https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/api.json
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
