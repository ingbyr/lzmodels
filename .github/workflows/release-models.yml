name: Release Models Data

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate api.json
        run: bun ./packages/core/script/generate-release.ts

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_name=Models Data $VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.release_name }}
          files: api.json
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## Models Data Release
            
            This release contains the latest AI model specifications database.
            
            - **File**: `api.json`
            - **Format**: JSON
            - **Contents**: Provider and model specifications with pricing, capabilities, and limits
            
            ### Usage
            
            ```bash
            curl -sL https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/api.json
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
